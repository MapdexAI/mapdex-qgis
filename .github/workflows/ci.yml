# The published plugin repository's own CI. It lives here at the same path it
# occupies there, so `git subtree split` publishes it as-is; the monorepo never
# runs it, because GitHub only discovers .github/workflows at a repository root.
#
# The public repo is a mirror, so this CI proves the published tree is the tree
# that builds the uploaded zip. The monorepo runs the same checks upstream of a
# merge (the qgis-plugin job in the root .github/workflows/ci.yml) and also
# proves this tree passes with the monorepo absent, so a red run here should be
# impossible rather than merely unlikely.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test dependency
        run: pip install -r requirements-dev.txt

      # The QGIS plugin repository runs flake8 and bandit on upload;
      # keep the tree clean here instead of reading it in a review.
      - name: Lint
        run: |
          python -m flake8 mapdex_qgis scripts tests
          python -m bandit -q -r mapdex_qgis --exclude mapdex_qgis/generated_contracts.py

      - name: Unit tests (no QGIS install required)
        run: python -m pytest tests -q
      - name: Build the plugin package
        run: python scripts/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapdex-qgis
          path: dist/mapdex-qgis.zip
