# Style policy for the plugin. Qt call sites are verbose, so the line budget is
# 120 rather than the pycodestyle default of 79. generated_contracts.py is
# produced by the contracts codegen and is never hand-formatted.
#
# mapdex_qgis/_vendor is deliberately NOT excluded. It is third-party source we
# ship, so it goes through the same lint the rest of the zip does; it happens to
# use the same 120-column budget, and if that ever stops being true the right
# answer is a change in the package, not a hole here.
[flake8]
max-line-length = 120
# E203 is pycodestyle disagreeing with black about `x[a : b]`, where the
# slice bounds are expressions. Black formats it that way deliberately and
# its own documentation says to disable this check; the code is not what is
# wrong. No other check is relaxed here.
extend-ignore = E203
exclude =
    .git,
    __pycache__,
    dist,
    mapdex_qgis/generated_contracts.py
per-file-ignores =
    tests/*:E402
    scripts/publish.py:E402
